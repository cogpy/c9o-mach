name: Release Please

# Inspired by: marduk-ml-sdk's release-please automation
# Automated versioning and changelog generation

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Automated Release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
    - uses: googleapis/release-please-action@v4
      id: release
      with:
        release-type: simple
        package-name: c9o-mach
        changelog-types: |
          [
            {"type": "feat", "section": "Features", "hidden": false},
            {"type": "fix", "section": "Bug Fixes", "hidden": false},
            {"type": "perf", "section": "Performance", "hidden": false},
            {"type": "refactor", "section": "Code Refactoring", "hidden": false},
            {"type": "docs", "section": "Documentation", "hidden": false},
            {"type": "ci", "section": "CI/CD", "hidden": false},
            {"type": "test", "section": "Tests", "hidden": false},
            {"type": "build", "section": "Build System", "hidden": false},
            {"type": "chore", "section": "Miscellaneous", "hidden": true}
          ]

  # Build release ISOs when a release is created
  build-release-isos:
    name: Build Release ISOs (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    
    strategy:
      fail-fast: false
      matrix:
        arch: [i686, x86_64]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential gcc-multilib binutils binutils-multiarch \
          autoconf automake libtool libtool-bin pkg-config gawk bison flex nasm \
          xorriso grub-pc-bin grub-common grub-efi-ia32-bin grub-efi-amd64-bin \
          mtools qemu-system-x86 texinfo \
          e2fsprogs dosfstools
          
    # ci-build.sh stages the Mach headers and builds MIG with the target
    # ABI before configuring the kernel
    - name: Build
      env:
        EXTRA_CONFIGURE_FLAGS: "--enable-live-iso --enable-installer --enable-install-iso"
      run: |
        ./scripts/ci-build.sh ${{ matrix.arch }}
        
    - name: Build ISOs
      working-directory: build-${{ matrix.arch }}
      run: |
        make iso-live
        make iso-install
        
    - name: Validate ISOs
      run: |
        for iso in build-${{ matrix.arch }}/*.iso; do
          ./scripts/validate-iso.sh "$iso"
        done
        
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        tag_name: ${{ needs.release-please.outputs.tag_name }}
        files: |
          build-${{ matrix.arch }}/*.iso
          build-${{ matrix.arch }}/*.iso.sha256
        fail_on_unmatched_files: false
